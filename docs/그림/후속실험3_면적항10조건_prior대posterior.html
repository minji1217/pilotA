<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>면적 항 10개 조건 — 자기 prior vs posterior</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#16232b;--ink2:#41535e;--ink3:#7d8f9a;--line:#e3e9ec;--bg:#fff;
      --gray:#c3ccd2;--ls:#1f8a3d;--warn:#c8531f;--tint:#f4f8f5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--ink);padding:34px 40px 30px}
h1{font-size:23px;margin:0 0 4px;letter-spacing:-.4px}
.sub{font-size:13px;color:var(--ink2);margin:0 0 6px;line-height:1.6}
.wrap{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:22px}
.panel{border:1px solid var(--line);border-radius:10px;padding:18px 20px 14px}
.ph{font-size:14.5px;font-weight:700;margin:0 0 2px}
.pm{font-size:11.5px;color:var(--ink3);margin:0 0 14px;font-family:'IBM Plex Mono',monospace}
.row{display:grid;grid-template-columns:118px 1fr;gap:10px;align-items:center;margin-bottom:11px}
.row.tag{background:var(--tint);margin:0 -10px 11px;padding:5px 10px;border-radius:6px}
.lab{text-align:right;font-size:12px;line-height:1.28}
.lab b{font-weight:500}
.lab i{display:block;font-style:normal;font-size:10px;color:var(--ink3);font-family:'IBM Plex Mono',monospace}
.bars{display:flex;flex-direction:column;gap:3px}
.bar{position:relative;height:13px}
.fill{position:absolute;left:0;top:0;height:100%;border-radius:0 2px 2px 0}
.val{position:absolute;top:50%;transform:translateY(-50%);font-size:10.5px;
     font-family:'IBM Plex Mono',monospace;color:var(--ink2);white-space:nowrap;padding-left:5px}
.axis{display:grid;grid-template-columns:118px 1fr;gap:10px;margin-top:9px;
      border-top:1px solid var(--line);padding-top:5px}
.ticks{position:relative;height:13px}
.ticks span{position:absolute;font-size:10px;color:var(--ink3);font-family:'IBM Plex Mono',monospace;transform:translateX(-50%)}
.legend{display:flex;gap:16px;font-size:11.5px;color:var(--ink2);margin-top:12px;align-items:center}
.sw{display:inline-block;width:20px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
.foot{margin-top:20px;font-size:12px;color:var(--ink2);line-height:1.75;
      border-left:3px solid var(--ls);padding-left:13px}
.foot b{color:var(--ls)}
</style></head><body>
<h1>면적 항 10개 조건 전부 — 자기 prior vs posterior (산사태 LS)</h1>
<p class="sub">가중평균 AUC · 가로축 0.50(무작위) 시작 · lam_gamma=10.
초록 배경은 <b>c/a = 1</b> 인 여섯 조건으로, 자기 prior 값이 소수점까지 같다.</p>
<div class="wrap" id="wrap"></div>
<div class="foot" id="foot"></div>
<script>
const D=[{"name": "A fixed", "a": 1.0, "c": 1.0, "ratio": 1.0, "old_prior": 0.8399598393574298, "old_post": 0.8550200803212852, "new_prior": 0.8850064316147492, "new_post": 0.860660586398132}, {"name": "B tied", "a": 0.8890630358122407, "c": 0.8890630358122407, "ratio": 1.0, "old_prior": 0.8399598393574298, "old_post": 0.8204252909072185, "new_prior": 0.8850064316147492, "new_post": 0.8496433887563566}, {"name": "C bounded", "a": 1.9766451434571248, "c": 1.0, "ratio": 0.5059077008891004, "old_prior": 0.8162676346411286, "old_post": 0.8030867057975491, "new_prior": 0.8968936003375807, "new_post": 0.8811856717483513}, {"name": "D free", "a": 1.8616153745419104, "c": 0.0062676832952768, "ratio": 0.003366798201706459, "old_prior": 0.7968643805993205, "old_post": 0.7710225517454433, "new_prior": 0.8775986722560457, "new_post": 0.8489777136239887}, {"name": "E c=0.5", "a": 1.0, "c": 0.5, "ratio": 0.5, "old_prior": 0.8162676346411286, "old_post": 0.7914684378539801, "new_prior": 0.8967391309592042, "new_post": 0.8435168173761087}, {"name": "F c=2", "a": 1.0, "c": 2.0, "ratio": 2.0, "old_prior": 0.8679358459478941, "old_post": 0.8657939450108125, "new_prior": 0.8373188523407639, "new_post": 0.8378520741381008}, {"name": "G LQ c=0.5", "a": 1.0, "c": 1.0, "ratio": 1.0, "old_prior": 0.8399598393574298, "old_post": 0.8550200803212852, "new_prior": 0.8850064316147492, "new_post": 0.8645703590408471}, {"name": "H LQ c=0.75", "a": 1.0, "c": 1.0, "ratio": 1.0, "old_prior": 0.8399598393574298, "old_post": 0.8506693440428382, "new_prior": 0.8850064316147492, "new_post": 0.8619623273005641}, {"name": "I LQ c 학습", "a": 1.0, "c": 1.0, "ratio": 1.0, "old_prior": 0.8399598393574298, "old_post": 0.8550200803212852, "new_prior": 0.8850064316147492, "new_post": 0.8649997174742917}, {"name": "J b만 학습", "a": 1.0, "c": 1.0, "ratio": 1.0, "old_prior": 0.8399598393574298, "old_post": 0.8234708063021315, "new_prior": 0.8850064316147492, "new_post": 0.8466226655122601}];
const LO=0.50, HI=0.92;
const pct=v=>((v-LO)/(HI-LO)*100);
function panel(title,meta,pk,ok,color){
  let h=`<div class="panel"><div class="ph">${title}</div><div class="pm">${meta}</div>`;
  for(const d of D){
    const g=d[ok]-d[pk], sg=(g>=0?"+":"−")+Math.abs(g).toFixed(3);
    const one=Math.abs(d.ratio-1)<1e-6;
    h+=`<div class="row${one?" tag":""}">
      <div class="lab"><b>${d.name}</b><i>c/a ${d.ratio.toFixed(3)}</i></div>
      <div class="bars">
        <div class="bar"><div class="fill" style="width:${pct(d[pk])}%;background:var(--gray)"></div>
          <div class="val" style="left:${pct(d[pk])}%">${d[pk].toFixed(3)}</div></div>
        <div class="bar"><div class="fill" style="width:${pct(d[ok])}%;background:${color}"></div>
          <div class="val" style="left:${pct(d[ok])}%">${d[ok].toFixed(3)} (${sg})</div></div>
      </div></div>`;
  }
  h+=`<div class="axis"><div></div><div class="ticks">`;
  for(const t of [0.50,0.60,0.70,0.80,0.90]) h+=`<span style="left:${pct(t)}%">${t.toFixed(2)}</span>`;
  h+=`</div></div><div class="legend">
      <span><span class="sw" style="background:var(--gray)"></span>자기 prior</span>
      <span><span class="sw" style="background:${color}"></span>posterior</span></div></div>`;
  return h;
}
document.getElementById("wrap").innerHTML =
  panel("후배 기준 — LS 정답의 NA를 평가에서 제외","125행 · 양성률 84% · AUC 정의 이벤트 5개","old_prior","old_post","var(--warn)") +
  panel("우리 기준 — LS 정답의 NA를 0으로 포함","418행 · 양성률 25.1% · AUC 정의 이벤트 9개","new_prior","new_post","var(--ls)");
const one=D.filter(d=>Math.abs(d.ratio-1)<1e-6).map(d=>d.name.split(" ")[0]).join("·");
document.getElementById("foot").innerHTML =
  `<b>${one} 여섯 조건의 자기 prior가 양쪽 기준 모두에서 완전히 같다</b> — 후배 기준 0.840, 우리 기준 0.885.
   z = a·log p̄ + b + c·(log k − m) 에서 b와 m은 전 행에 더해지는 상수라 순위를 못 바꾸고,
   a와 c가 같은 배율이면 전체 스케일만 변해 역시 순위가 그대로다. AUC는 순위만 보므로 값이 같아진다.
   순위가 실제로 갈리는 것은 c/a 비율이 다른 <b>C·E(0.5)</b>, <b>D(0.003)</b>, <b>F(2.0)</b> 뿐이다.
   <br>후배 그래프에 A~F만 있어 달라 보였을 뿐, G·H·I·J를 넣으면 A 위에 그대로 포개진다.
   두 기준의 차이는 <b>값의 높이</b>(NA 293행 복원으로 prior가 +0.045, posterior는 +0.006만 상승)이지 겹침의 규칙이 아니다.`;
</script></body></html>
